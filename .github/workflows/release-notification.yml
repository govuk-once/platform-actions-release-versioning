name: Production Release Notification

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        required: true
        type: string
      type:
        required: true
        type: string
      notification-topic-arn:
        description: SNS topic connected to the required Slack channel
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "eu-west-2"

    secrets:
      deployment-role:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    name: Send production release notification

    # Patch releases and no-release runs are silently skipped.
    if: inputs.type == 'major' || inputs.type == 'minor'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.deployment-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: release-notification-${{ github.run_id }}

      - name: Publish release notification
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION: ${{ inputs.application }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.type }}
          TOPIC_ARN: ${{ inputs.notification-topic-arn }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RELEASE_TAG="v${VERSION}"
          RELEASE_URL="${SERVER_URL}/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          RELEASE_NOTES=$(gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json body \
            --jq '.body // "No release notes were provided."')

          TITLE="${APPLICATION} ${RELEASE_TYPE} release: ${RELEASE_TAG}"

          DESCRIPTION=$(printf \
            '*%s* has been successfully deployed to production.\n\n%s\n\n<%s|View GitHub release> · <%s|View deployment>' \
            "$RELEASE_TAG" \
            "$RELEASE_NOTES" \
            "$RELEASE_URL" \
            "$RUN_URL")

          MESSAGE=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESCRIPTION" \
            '{
              version: "1.0",
              source: "custom",
              content: {
                textType: "client-markdown",
                title: $title,
                description: $description
              }
            }')

          aws sns publish \
            --topic-arn "$TOPIC_ARN" \
            --message "$MESSAGE"