name: Production Release Notification

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      version:
        required: true
        type: string
      type:
        required: true
        type: string
      slack-channel:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "eu-west-2"

    secrets:
      deployment-role:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    name: Send production release notification

    # Patch releases and no-release runs are silently skipped.
    if: inputs.type == 'major' || inputs.type == 'minor'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.deployment-role }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: release-notification-${{ github.run_id }}

      - name: Get AWS account ID
        id: aws-account
        run: |
          echo "account-id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Prepare release notification
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION: ${{ inputs.application }}
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.type }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RELEASE_TAG="v${VERSION}"
          RELEASE_URL="${SERVER_URL}/${REPOSITORY}/releases/tag/${RELEASE_TAG}"
          RUN_URL="${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}"

          RELEASE_NOTES=$(gh release view "$RELEASE_TAG" \
          --repo "$REPOSITORY" \
          --json body \
          --jq '.body // "No release notes were provided."')

          TITLE="${APPLICATION} ${RELEASE_TYPE} release: ${RELEASE_TAG}"

          DESCRIPTION=$(printf \
          '*%s* has been successfully deployed to production.\n\n%s\n\n<%s|View GitHub release> · <%s|View deployment>' \
          "$APPLICATION" \
          "$RELEASE_NOTES" \
          "$RELEASE_URL" \
          "$RUN_URL")

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"

          {
          echo "DESCRIPTION<<EOF"
          echo "$DESCRIPTION"
          echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send Notification
        uses: govuk-once/govuk-platform-notifications-gh-action@c66db974e7cba94f50c45b30e9cd880d905910c1
        with:
          aws_account_id: ${{ steps.aws-account.outputs.account-id }}
          message_type: release
          message: ${{ env.TITLE }}
          description: ${{ env.DESCRIPTION }}
          repository: ${{ github.repository }}
          tag: ${{ env.RELEASE_TAG }}
          slack_channel: ${{ inputs.slack-channel }}
